[project]
name = "gatlor-cli"
version = "0.1.0"
description = "Free Gatlor CLI: wrap Syft and OSV, write CycloneDX SBOM, VEX, and a readiness checklist"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "gatlor-evidence",
    "gatlor-ingest",
    "gatlor-vendors",
]

[project.scripts]
gatlor = "gatlor_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatlor_cli"]
