name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gatlor
        with:
          out-dir: dist/gatlor
      - name: Checksums
        working-directory: dist/gatlor
        run: sha256sum sbom.cdx.json vex.cdx.json readiness-checklist.md > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/gatlor/sbom.cdx.json \
            dist/gatlor/vex.cdx.json \
            dist/gatlor/readiness-checklist.md \
            dist/gatlor/SHA256SUMS \
            --verify-tag \
            --title "Gatlor $GITHUB_REF_NAME" \
            --generate-notes
