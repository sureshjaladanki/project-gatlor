name: Gatlor scan
description: Wrap Syft and OSV. Write a CycloneDX SBOM, a VEX file, and a readiness checklist.
inputs:
  path:
    description: Tree for Syft to scan
    required: false
    default: "."
  out-dir:
    description: Directory for SBOM, VEX, and checklist
    required: false
    default: dist/gatlor
  repo-root:
    description: Directory that holds SECURITY.md and SUPPORT.md
    required: false
    default: "."
  syft-version:
    description: Syft release tag
    required: false
    default: v1.48.0
  sbom:
    description: CycloneDX JSON path. When set, skip Syft and pass --sbom to the CLI
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: gatlor-scan
runs:
  using: composite
  steps:
    - name: Install Syft
      shell: bash
      env:
        SYFT_VERSION: ${{ inputs.syft-version }}
      run: |
        if [ -z "${{ inputs.sbom }}" ]; then
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin" "$SYFT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.12"
    - name: Scan
      shell: bash
      run: |
        ACTION_ROOT="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        cd "$ACTION_ROOT"
        uv sync --frozen --all-groups
        WS="$GITHUB_WORKSPACE"
        SBOM_ARGS=()
        if [ -n "${{ inputs.sbom }}" ]; then
          SBOM_ARGS=(--sbom "$WS/${{ inputs.sbom }}")
        fi
        uv run --directory "$ACTION_ROOT" gatlor scan \
          --path "$WS/${{ inputs.path }}" \
          --out-dir "$WS/${{ inputs.out-dir }}" \
          --repo-root "$WS/${{ inputs.repo-root }}" \
          "${SBOM_ARGS[@]}"
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}
