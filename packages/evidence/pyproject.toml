[project]
name = "gatlor-evidence"
version = "0.1.0"
description = "SBOM-adjacent evidence formats for the CLI (checklist, VEX document)"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "cyclonedx-python-lib[validation]>=8.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatlor_evidence"]
