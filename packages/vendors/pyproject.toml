[project]
name = "gatlor-vendors"
version = "0.1.0"
description = "Wrappers for Syft and OSV"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "packageurl-python>=0.13",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatlor_vendors"]
